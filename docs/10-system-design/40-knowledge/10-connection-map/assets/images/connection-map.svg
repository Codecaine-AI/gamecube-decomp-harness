<svg viewBox="0 0 1400 850" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Melee knowledge graph connection map</title>
  <desc>A target source file connects to a derived code graph, an understanding layer of evidence-backed annotations, a raw searchable corpus, an append-only ledger of attempts and tactics, and an authored standards cluster.</desc>
  <style>
  :root {
    --bg: #FDFCFA; --text: #2C2C2A; --muted: #5F5E5A; --faint: #85837B;
    --border: #D3D1C7; --code-bg: #F1EFE8;
    --purple-f:#EEEDFE; --purple-s:#534AB7; --purple-t:#3C3489;
    --teal-f:#E1F5EE;   --teal-s:#0F6E56;   --teal-t:#085041;
    --coral-f:#FAECE7;  --coral-s:#993C1D;  --coral-t:#712B13;
    --pink-f:#FBEAF0;   --pink-s:#993556;   --pink-t:#72243E;
    --amber-f:#FAEEDA;  --amber-s:#854F0B;  --amber-t:#633806;
    --gray-f:#F1EFE8;   --gray-s:#5F5E5A;   --gray-t:#2C2C2A;
    --j-key:#534AB7; --j-str:#0F6E56; --j-num:#BA7517; --j-com:#85837B; --j-pun:#5F5E5A;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1B1B19; --text: #E8E6DF; --muted: #B4B2A9; --faint: #8A887F;
      --border: #444441; --code-bg: #2C2C2A;
      --purple-f:#3C3489; --purple-s:#AFA9EC; --purple-t:#CECBF6;
      --teal-f:#085041;   --teal-s:#5DCAA5;   --teal-t:#9FE1CB;
      --coral-f:#712B13;  --coral-s:#F0997B;  --coral-t:#F5C4B3;
      --pink-f:#72243E;   --pink-s:#ED93B1;   --pink-t:#F4C0D1;
      --amber-f:#633806;  --amber-s:#EF9F27;  --amber-t:#FAC775;
      --gray-f:#2C2C2A;   --gray-s:#B4B2A9;   --gray-t:#F1EFE8;
      --j-key:#AFA9EC; --j-str:#5DCAA5; --j-num:#EF9F27; --j-com:#8A887F; --j-pun:#B4B2A9;
    }
  }
  svg text { font-family: -apple-system, "Segoe UI", "Helvetica Neue", sans-serif; }
  .tt  { font-size: 15px; font-weight: 600; }
  .st  { font-size: 12.5px; font-weight: 400; }
  .lbl { font-size: 12.5px; fill: var(--faint); }
  .clab{ font-size: 13px; fill: var(--muted); font-weight: 600; letter-spacing: 0.02em; }
  .edge  { stroke: var(--faint); stroke-width: 1.25; fill: none; }
  .qedge { stroke: var(--faint); stroke-width: 1.25; fill: none; stroke-dasharray: 6 4; }
  .cluster { fill: none; stroke: var(--border); stroke-width: 1; stroke-dasharray: 5 4; }
  .b-gray   { fill: var(--gray-f);   stroke: var(--gray-s);   stroke-width: 1; }
  .b-purple { fill: var(--purple-f); stroke: var(--purple-s); stroke-width: 1; }
  .b-teal   { fill: var(--teal-f);   stroke: var(--teal-s);   stroke-width: 1; }
  .b-coral  { fill: var(--coral-f);  stroke: var(--coral-s);  stroke-width: 1; }
  .b-pink   { fill: var(--pink-f);   stroke: var(--pink-s);   stroke-width: 1; }
  .b-amber  { fill: var(--amber-f);  stroke: var(--amber-s);  stroke-width: 1; }
  .t-gray   { fill: var(--gray-t); }   .s-gray   { fill: var(--gray-s); }
  .t-purple { fill: var(--purple-t); } .s-purple { fill: var(--purple-s); }
  .t-teal   { fill: var(--teal-t); }   .s-teal   { fill: var(--teal-s); }
  .t-coral  { fill: var(--coral-t); }  .s-coral  { fill: var(--coral-s); }
  .t-pink   { fill: var(--pink-t); }   .s-pink   { fill: var(--pink-s); }
  .t-amber  { fill: var(--amber-t); }  .s-amber  { fill: var(--amber-s); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="var(--faint)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- legend -->
  <line class="edge" x1="40" y1="52" x2="80" y2="52"/>
  <text class="lbl" x="88" y="56">graph edge — derived at build time</text>
  <line class="qedge" x1="40" y1="76" x2="80" y2="76"/>
  <text class="lbl" x="88" y="80">query path — worker at runtime</text>

  <!-- target -->
  <rect class="b-gray" x="590" y="40" width="220" height="56" rx="6"/>
  <text class="tt t-gray" x="700" y="64" text-anchor="middle">target file</text>
  <text class="st s-gray" x="700" y="83" text-anchor="middle">ftkirbyspecialhi.c</text>

  <!-- target -> functions -->
  <path class="edge" d="M 640 96 L 640 120 L 150 120 L 150 196" marker-end="url(#arr)"/>
  <text class="lbl" x="395" y="112" text-anchor="middle">CONTAINS · file → unit → function</text>

  <!-- target -> annotations digest (query) -->
  <line class="qedge" x1="700" y1="96" x2="700" y2="146" marker-end="url(#arr)"/>
  <text class="lbl" x="710" y="126">annotations digest @ boot</text>

  <!-- target -> smashwiki (query) -->
  <path class="qedge" d="M 810 68 L 1180 68 L 1180 196" marker-end="url(#arr)"/>
  <text class="lbl" x="830" y="58">crosswalk — path → wiki page titles (mechanical)</text>

  <!-- derived cluster -->
  <rect class="cluster" x="40" y="150" width="560" height="330" rx="8"/>
  <text class="clab" x="56" y="178">derived — rebuilt from checkout · zero drift</text>

  <rect class="b-purple" x="60" y="200" width="180" height="64" rx="6"/>
  <text class="tt t-purple" x="150" y="227" text-anchor="middle">functions</text>
  <text class="st s-purple" x="150" y="247" text-anchor="middle">symbols · match %</text>

  <rect class="b-purple" x="360" y="200" width="220" height="64" rx="6"/>
  <text class="tt t-purple" x="470" y="227" text-anchor="middle">peers</text>
  <text class="st s-purple" x="470" y="247" text-anchor="middle">calls · called-by · data refs</text>

  <rect class="b-purple" x="60" y="350" width="180" height="64" rx="6"/>
  <text class="tt t-purple" x="150" y="377" text-anchor="middle">analogs</text>
  <text class="st s-purple" x="150" y="397" text-anchor="middle">opseq similarity</text>

  <rect class="b-purple" x="360" y="350" width="220" height="64" rx="6"/>
  <text class="tt t-purple" x="470" y="377" text-anchor="middle">siblings</text>
  <text class="st s-purple" x="470" y="397" text-anchor="middle">naming · same-area patterns</text>

  <line class="edge" x1="240" y1="232" x2="356" y2="232" marker-end="url(#arr)"/>
  <text class="lbl" x="300" y="222" text-anchor="middle">CALLS · DATA_REFS</text>
  <line class="edge" x1="150" y1="264" x2="150" y2="346" marker-end="url(#arr)"/>
  <text class="lbl" x="160" y="300">ANALOGOUS_TO</text>
  <path class="edge" d="M 230 264 L 230 310 L 470 310 L 470 346" marker-end="url(#arr)"/>
  <text class="lbl" x="330" y="302" text-anchor="middle">SIBLING_OF</text>

  <!-- annotations cluster -->
  <rect class="cluster" x="640" y="150" width="330" height="330" rx="8"/>
  <text class="clab" x="656" y="178">understanding — evidence-backed annotations</text>

  <rect class="b-amber" x="660" y="205" width="290" height="125" rx="6"/>
  <text class="tt t-amber" x="805" y="235" text-anchor="middle">annotation — function meaning</text>
  <text class="st s-amber" x="805" y="259" text-anchor="middle">what it does, in game terms</text>
  <text class="st s-amber" x="805" y="277" text-anchor="middle">anchored to symbol + content hash</text>
  <text class="st s-amber" x="805" y="295" text-anchor="middle">evidence refs required</text>
  <text class="st s-amber" x="805" y="313" text-anchor="middle">proposed → corroborated → graduated</text>

  <line class="edge" x1="805" y1="330" x2="805" y2="366" marker-end="url(#arr)"/>
  <text class="lbl" x="815" y="352">corroborated</text>

  <rect class="b-amber" x="660" y="370" width="290" height="80" rx="6"/>
  <text class="tt t-amber" x="805" y="398" text-anchor="middle">graduation</text>
  <text class="st s-amber" x="805" y="420" text-anchor="middle">rename / comment PRs upstream</text>
  <text class="st s-amber" x="805" y="438" text-anchor="middle">knowledge becomes code</text>

  <!-- derived <-> annotations -->
  <line class="edge" x1="602" y1="320" x2="656" y2="320" marker-end="url(#arr)"/>
  <text class="lbl" x="630" y="310" text-anchor="end">ANNOTATED_BY</text>
  <line class="edge" x1="660" y1="410" x2="604" y2="410" marker-end="url(#arr)"/>
  <text class="lbl" x="596" y="432" text-anchor="end">GRADUATES → derived</text>

  <!-- annotations -> corpus -->
  <line class="edge" x1="950" y1="245" x2="1014" y2="237" marker-end="url(#arr)"/>
  <text class="lbl" x="982" y="228" text-anchor="middle">EVIDENCE</text>

  <!-- corpus cluster -->
  <rect class="cluster" x="1000" y="150" width="360" height="240" rx="8"/>
  <text class="clab" x="1016" y="178">corpus — raw · searchable</text>

  <rect class="b-teal" x="1020" y="200" width="320" height="84" rx="6"/>
  <text class="tt t-teal" x="1180" y="230" text-anchor="middle">smashwiki mirror</text>
  <text class="st s-teal" x="1180" y="254" text-anchor="middle">1,600 pages · per-section retrieval</text>
  <text class="st s-teal" x="1180" y="272" text-anchor="middle">hitbox tables · frame data · media</text>

  <text class="lbl" x="1180" y="330" text-anchor="middle">keyword-searched on demand;</text>
  <text class="lbl" x="1180" y="348" text-anchor="middle">content never injected wholesale</text>

  <!-- derived -> ledger -->
  <line class="edge" x1="420" y1="480" x2="420" y2="626" marker-end="url(#arr)"/>
  <text class="lbl" x="410" y="545" text-anchor="end">ATTEMPTED_IN / TOUCHED_BY</text>

  <!-- ledger -> annotations -->
  <path class="edge" d="M 500 630 L 500 520 L 805 520 L 805 484" marker-end="url(#arr)"/>
  <text class="lbl" x="700" y="512" text-anchor="middle">PRODUCES</text>

  <!-- ledger cluster -->
  <rect class="cluster" x="40" y="560" width="880" height="250" rx="8"/>
  <text class="clab" x="56" y="588">ledger — append-only work history</text>

  <rect class="b-coral" x="60" y="610" width="170" height="44" rx="6"/>
  <text class="tt t-coral" x="145" y="629" text-anchor="middle" font-size="14">upstream PRs</text>
  <text class="st s-coral" x="145" y="646" text-anchor="middle">intake normalizer</text>

  <rect class="b-coral" x="60" y="670" width="170" height="44" rx="6"/>
  <text class="tt t-coral" x="145" y="689" text-anchor="middle" font-size="14">worker runs</text>
  <text class="st s-coral" x="145" y="706" text-anchor="middle">intake normalizer</text>

  <rect class="b-coral" x="60" y="730" width="170" height="44" rx="6"/>
  <text class="tt t-coral" x="145" y="749" text-anchor="middle" font-size="14">QA repairs</text>
  <text class="st s-coral" x="145" y="766" text-anchor="middle">intake normalizer</text>

  <line class="edge" x1="230" y1="632" x2="276" y2="642" marker-end="url(#arr)"/>
  <line class="edge" x1="230" y1="692" x2="276" y2="692" marker-end="url(#arr)"/>
  <line class="edge" x1="230" y1="752" x2="276" y2="742" marker-end="url(#arr)"/>

  <rect class="b-coral" x="280" y="630" width="290" height="130" rx="6"/>
  <text class="tt t-coral" x="425" y="660" text-anchor="middle">attempt — canonical record</text>
  <text class="st s-coral" x="425" y="684" text-anchor="middle">one shape for PR · run · repair</text>
  <text class="st s-coral" x="425" y="702" text-anchor="middle">targets · before/after · outcome</text>
  <text class="st s-coral" x="425" y="720" text-anchor="middle">failure class · tactics · evidence</text>

  <line class="edge" x1="570" y1="700" x2="656" y2="700" marker-end="url(#arr)"/>
  <text class="lbl" x="613" y="692" text-anchor="middle">EXTRACTS</text>

  <rect class="b-coral" x="660" y="655" width="240" height="90" rx="6"/>
  <text class="tt t-coral" x="780" y="685" text-anchor="middle">tactic</text>
  <text class="st s-coral" x="780" y="707" text-anchor="middle">a view over attempts</text>
  <text class="st s-coral" x="780" y="725" text-anchor="middle">efficacy-ranked · searchable</text>

  <!-- tactic -> standards -->
  <path class="edge" d="M 900 700 L 940 700 L 940 652 L 976 652" marker-end="url(#arr)"/>
  <text class="lbl" x="908" y="720">HARDENS_INTO</text>

  <!-- authored cluster -->
  <rect class="cluster" x="960" y="560" width="400" height="250" rx="8"/>
  <text class="clab" x="976" y="588">authored — QA-owned · enforcement loop</text>

  <rect class="b-pink" x="980" y="620" width="170" height="64" rx="6"/>
  <text class="tt t-pink" x="1065" y="647" text-anchor="middle">standards</text>
  <text class="st s-pink" x="1065" y="667" text-anchor="middle">boot + ship gate</text>

  <rect class="b-pink" x="1180" y="620" width="160" height="64" rx="6"/>
  <text class="tt t-pink" x="1260" y="647" text-anchor="middle">qa rules</text>
  <text class="st s-pink" x="1260" y="667" text-anchor="middle">lint · preship</text>

  <line class="edge" x1="1150" y1="652" x2="1176" y2="652" marker-end="url(#arr)"/>

  <rect class="b-pink" x="980" y="720" width="360" height="56" rx="6"/>
  <text class="tt t-pink" x="1160" y="743" text-anchor="middle" font-size="14">examples — preferred / rejected</text>
  <text class="st s-pink" x="1160" y="761" text-anchor="middle">absorbs banned_patterns as VIOLATES</text>

  <line class="edge" x1="1065" y1="716" x2="1065" y2="688" marker-end="url(#arr)"/>
  <text class="lbl" x="1075" y="708">VIOLATES / EXEMPLIFIES</text>
</svg>