[test]
# Keep bare `bun test` and filename filters out of game workspaces, knowledge
# corpora, and vendored examples. Bun 1.3.10 has no test.pathIgnorePatterns.
# `bun run test` explicitly includes app and toolpack suites; ./paths bypass
# this discovery root when running an individual test elsewhere in the repo.
root = "apps"

[install]
# Keep the hoisted layout: the agent-kernel boundary test resolves the
# root node_modules/@agent-kernel/* links, which the isolated linker drops.
linker = "hoisted"
